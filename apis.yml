description: 'BrosMed Medical (Guangdong Brosmed Medical Technology Co., Ltd.) is a medical device
  manufacturer founded in 2012 and headquartered in Dongguan, Guangdong, China, specializing in the
  research, manufacturing, and global sale of high-performance vascular intervention medical devices.
  Its product families span cardiovascular intervention, peripheral vascular intervention, hemodialysis
  access, neurointervention, and intervention accessories. The company employs over 1,000 staff, holds
  650+ product registrations, and sells across 100+ countries. It was surfaced as a portfolio company of
  IDG Capital and added to the API Evangelist network; as a physical medical-device manufacturer it
  publishes no public developer/API surface.'
